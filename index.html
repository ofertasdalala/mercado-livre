<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Links e Busca - Mercado Livre</title>
    <script src="config.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .tabs {
            display: flex;
            background-color: #2c2c2c;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: #aaa;
        }

        .tab.active {
            background-color: #ffe600; /* Amarelo do Mercado Livre */
            color: #2d3277; /* Azul do Mercado Livre */
            box-shadow: 0 4px 12px rgba(255, 230, 0, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 45px;
            background-color: #2b2b2b;
            border: 1px solid #3c3c3c;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #ffe600;
        }

        .input-group .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 16px;
        }

        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #ffe600, #ffcc00);
            color: #2d3277;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 230, 0, 0.3);
            transition: opacity 0.2s;
            margin-bottom: 24px;
        }

        .btn-generate:hover {
            opacity: 0.9;
        }

        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-social {
            flex: 1;
            padding: 14px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn-whatsapp {
            background-color: #25d366;
        }

        .btn-telegram {
            background-color: #0088cc;
        }

        .btn-social:hover {
            opacity: 0.9;
        }

        #result-box {
            display: none;
            margin-bottom: 20px;
            background: #2b2b2b;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Abas do Topo -->
        <div class="tabs">
            <div class="tab active" id="tab-link" onclick="switchTab('link')">🔗 Ver na Vitrine</div>
            <div class="tab" id="tab-search" onclick="switchTab('search')">🔍 Pesquisar</div>
        </div>

        <!-- Conteúdo da Aba 1: Gerar Link / Redirecionar para Vitrine -->
        <div id="content-link" class="tab-content active">
            <div class="input-group">
                <span class="icon">📋</span>
                <input type="text" id="product-link" placeholder="Cole aqui o link do produto do Mercado Livre...">
            </div>
            <button class="btn-generate" onclick="redirecionarVitrineML()">ACESSAR VIA VITRINE ⚡</button>
        </div>

        <!-- Conteúdo da Aba 2: Pesquisar -->
        <div id="content-search" class="tab-content">
            <div class="input-group">
                <span class="icon">🔍</span>
                <input type="text" id="search-keyword" placeholder="O que você procura no Mercado Livre?">
            </div>
            <button class="btn-generate" onclick="pesquisarML()">BUSCAR NO MERCADO LIVRE 🛍️</button>
        </div>

        <!-- Caixa de Resultado -->
        <div id="result-box">
            <div style="font-size: 14px; margin-bottom: 10px; color: #ffe600; font-weight: bold;">✨ Redirecionando para a Vitrine!</div>
            <button onclick="copiarLinkGerado()" style="background-color: #25d366; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;">
                📋 Copiar Link da Vitrine
            </button>
        </div>

        <!-- Botões Sociais -->
        <div class="social-buttons">
            <a href="https://chat.whatsapp.com/KtUorhgfb9J1EwtOnIA530" target="_blank" class="btn-social btn-whatsapp">
                💬 GRUPO NO WHATSAPP
            </a>
            <a href="https://t.me/promos_da_lala" target="_blank" class="btn-social btn-telegram">
                🤖 GRUPO NO TELEGRAM
            </a>
        </div>
    </div>
    
    <script>
        function switchTab(type) {
            document.getElementById('tab-link').classList.remove('active');
            document.getElementById('tab-search').classList.remove('active');
            document.getElementById('content-link').classList.remove('active');
            document.getElementById('content-search').classList.remove('active');

            if (type === 'link') {
                document.getElementById('tab-link').classList.add('active');
                document.getElementById('content-link').classList.add('active');
            } else {
                document.getElementById('tab-search').classList.add('active');
                document.getElementById('content-search').classList.add('active');
            }
        }

        function pesquisarML() {
            const query = document.getElementById('search-keyword').value.trim();
            if (!query) {
                alert('Digite um termo para pesquisar.');
                return;
            }
            const searchUrl = `https://lista.mercadolivre.com.br/${encodeURIComponent(query)}`;
            window.open(searchUrl, '_blank');
        }

        let linkAfiliadoFinal = "";

        function redirecionarVitrineML() {
            const inputUrl = document.getElementById('product-link').value.trim();
            
            if (!inputUrl) {
                alert('Por favor, cole o link do produto do Mercado Livre.');
                return;
            }

            const affiliateTag = (typeof CONFIG !== 'undefined') ? CONFIG.AFFILIATE_ID : "vstoreon";

            if (!affiliateTag) {
                alert('Atenção: A tag de afiliado não foi configurada corretamente.');
                return;
            }

            // Redireciona para a vitrine social configurada (ex: https://www.mercadolivre.com.br/social/vstoreon)
            linkAfiliadoFinal = `https://www.mercadolivre.com.br/social/${affiliateTag}`;

            document.getElementById('result-box').style.display = 'block';
            window.open(linkAfiliadoFinal, '_blank');
        }

        function copiarLinkGerado() {
            if (!linkAfiliadoFinal) return;
            
            navigator.clipboard.writeText(linkAfiliadoFinal).then(() => {
                alert('Link da vitrine copiado para a área de transferência!');
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
            });
        }
    </script>

</body>
</html>
