<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine e Busca - Mercado Livre</title>
    <script src="config.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .tabs {
            display: flex;
            background-color: #2c2c2c;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: #aaa;
        }

        .tab.active {
            background-color: #ffe600; /* Amarelo Mercado Livre */
            color: #2d3277; /* Azul Mercado Livre */
            box-shadow: 0 4px 12px rgba(255, 230, 0, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 45px;
            background-color: #2b2b2b;
            border: 1px solid #3c3c3c;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #ffe600;
        }

        .input-group .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 16px;
        }

        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #ffe600, #ffcc00);
            color: #2d3277;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 230, 0, 0.3);
            transition: opacity 0.2s;
            margin-bottom: 16px;
        }

        .btn-generate:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            width: 100%;
            background-color: #25d366;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 24px;
        }

        .btn-secondary:hover {
            opacity: 0.9;
        }

        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-social {
            flex: 1;
            padding: 14px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn-whatsapp {
            background-color: #25d366;
        }

        .btn-telegram {
            background-color: #0088cc;
        }

        .btn-social:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Abas do Topo -->
        <div class="tabs">
            <div class="tab active" id="tab-vitrine" onclick="switchTab('vitrine')">🛍️ Nossa Vitrine</div>
            <div class="tab" id="tab-search" onclick="switchTab('search')">🔍 Pesquisar</div>
        </div>

        <!-- Conteúdo da Aba 1: Ver na Vitrine -->
        <div id="content-vitrine" class="tab-content active">
            <button class="btn-generate" onclick="acessarVitrineML()">ABRIR VITRINE MERCADO LIVRE ⚡</button>
            <button class="btn-secondary" onclick="copiarLinkVitrine()">📋 COPIAR LINK DA VITRINE</button>
        </div>

        <!-- Conteúdo da Aba 2: Pesquisar -->
        <div id="content-search" class="tab-content">
            <div class="input-group">
                <span class="icon">🔍</span>
                <input type="text" id="search-keyword" placeholder="O que você procura no Mercado Livre?">
            </div>
            <button class="btn-generate" onclick="pesquisarML()">BUSCAR NO MERCADO LIVRE 🛍️</button>
        </div>

        <!-- Botões Sociais -->
        <div class="social-buttons">
            <a href="https://chat.whatsapp.com/KtUorhgfb9J1EwtOnIA530" target="_blank" class="btn-social btn-whatsapp">
                💬 GRUPO NO WHATSAPP
            </a>
            <a href="https://t.me/promos_da_lala" target="_blank" class="btn-social btn-telegram">
                🤖 GRUPO NO TELEGRAM
            </a>
        </div>
    </div>
    
    <script>
        function getVitrineUrl() {
            const affiliateTag = (typeof CONFIG !== 'undefined' && CONFIG.AFFILIATE_ID) ? CONFIG.AFFILIATE_ID : "vstoreon";
            return `https://www.mercadolivre.com.br/social/${affiliateTag}`;
        }

        function switchTab(type) {
            document.getElementById('tab-vitrine').classList.remove('active');
            document.getElementById('tab-search').classList.remove('active');
            document.getElementById('content-vitrine').classList.remove('active');
            document.getElementById('content-search').classList.remove('active');

            if (type === 'vitrine') {
                document.getElementById('tab-vitrine').classList.add('active');
                document.getElementById('content-vitrine').classList.add('active');
            } else {
                document.getElementById('tab-search').classList.add('active');
                document.getElementById('content-search').classList.add('active');
            }
        }

        function acessarVitrineML() {
            window.open(getVitrineUrl(), '_blank');
        }

        function copiarLinkVitrine() {
            const url = getVitrineUrl();
            navigator.clipboard.writeText(url).then(() => {
                alert('Link da vitrine copiado com sucesso!');
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
            });
        }

        function pesquisarML() {
            const query = document.getElementById('search-keyword').value.trim();
            if (!query) {
                alert('Digite um termo para pesquisar.');
                return;
            }
            const searchUrl = `https://lista.mercadolivre.com.br/${encodeURIComponent(query)}`;
            window.open(searchUrl, '_blank');
        }
    </script>

</body>
</html>
